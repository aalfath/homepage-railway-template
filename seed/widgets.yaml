---
# Information widgets at the top of the page.
# Options: https://gethomepage.dev/configs/info-widgets/

- resources:
    cpu: true
    memory: true
    disk: /app/config

- datetime:
    text_size: md
    format:
      dateStyle: medium
      timeStyle: short

- search:
    provider: duckduckgo
    target: _blank
